# Tag `v<version>` from package.json and open a GitHub release, once per new
# version, through the family's reusable workflow. Everything but the triggers,
# the token grant and the title lives in
# jsvolos63/vendor-cli/.github/workflows/release.yml — seven repos used to
# hand-copy this and all seven had drifted.
#
# Gated on Test going green: a plain `push` trigger can tag and publish a
# release for a RED main, which is what the consolidation fixed. Manual
# dispatch skips the gate on purpose — it is the backfill path for a version
# whose push fired no workflows (a bump PR auto-merged with the default
# GITHUB_TOKEN does not).
#
# `workflows:` must match the CI workflow's `name:` EXACTLY; a typo here
# silently never fires.

name: Release

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    # REQUIRED. workflow_run fires for a CI run on ANY branch, so without
    # this a green run on a feature branch would tag that branch's commit
    # and publish a release from unmerged work.
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # a called workflow cannot elevate its own token

jobs:
  release:
    uses: jsvolos63/vendor-cli/.github/workflows/release.yml@main
    with:
      title: '@jfs/netlify-kit'
